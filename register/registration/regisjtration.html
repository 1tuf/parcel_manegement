<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>New Registration</title>
  <link rel="stylesheet" href="registration.css" />
</head>
<body>
  <div class="register">
    <h3 id="heading">New Register</h3>
    <form>
      <label for="name">Name:</label>
      <input type="text" id="name" />

      <!-- <label for="username">Username:</label>
      <input type="text" id="username" /> -->

      <label for="email">Email:</label>
      <input type="email" id="email" />

      <label for="countryCode">Mob Number:</label>
      <div class="phone-group">
        <input type="text" id="countryCode" placeholder="+91" />
        <input type="text" id="number" placeholder="Mobile Number" />
      </div>

      <label for="password">Password:</label>
      <input type="password" id="password" />

      <label for="confirmPassword">Confirm Password:</label>
      <input type="password" id="confirmPassword" />

      <button type="reset">Reset</button>
      <button type="submit" id="submit">Register</button>
    </form>
  </div>

  <div class="registerDone">
    <h4>Registration Succesfull!</h4>
    <p><strong>Name :</strong>  <span id="displayName"></span></p>
    <p><strong>Username :</strong>  <span id="displayUsername"></span></p>
    <p><strong>Email :</strong>  <span id="displayEmail"></span></p>
    <button id="okButton">OK</button>
  </div>

  <script src="registration.js"></script>
</body>
</html>
